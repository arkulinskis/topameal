<div class="sl-item-host" role="listitem">
  <label class="sl-item" anvil:name="row">
    <input type="checkbox" anvil:dom-node="box">
    <span class="box" aria-hidden="true"><i class="ic ic-check"></i></span>
    <span class="sl-text">
      <span class="what" anvil:dom-node="what"></span>
      <span class="for" anvil:dom-node="for_text"></span>
      <span class="by" anvil:dom-node="by"></span>
      <span class="tm-flag warn" anvil:name="perish"><i class="ic ic-fridge"></i><span anvil:dom-node="perish_text"></span></span>
    </span>
  </label>
</div>
