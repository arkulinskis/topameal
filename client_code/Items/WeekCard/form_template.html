<div class="wk-card-host">
  <article class="wk-card" anvil:name="card" anvil:on-dom:click="self.card_click">
    <span class="num" aria-hidden="true" anvil:dom-node="num"></span>
    <div class="wk-body">
      <h3 class="wk-title"><a anvil:name="title_link" href="#home"><span anvil:dom-node="title"></span></a></h3>
      <anvil-component type="Topameal.Components.Meta" name="meta"></anvil-component>
      <div class="flags">
        <span class="tm-flag" anvil:dom-node="flag"><i class="ic" anvil:dom-node="flag_icon"></i><span anvil:dom-node="flag_text"></span></span>
        <anvil-component type="Button" name="no_button" prop:text="No thanks" prop:role='["btn", "btn-ghost", "btn-sm", "ic-x", "wk-no"]'></anvil-component>
      </div>
      <p class="tip" anvil:name="tip"><i class="ic ic-snow"></i><span anvil:dom-node="tip_text"></span></p>
    </div>
  </article>
</div>
